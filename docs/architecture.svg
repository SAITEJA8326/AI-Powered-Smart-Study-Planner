<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8090b2"/></marker>
  <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66a6ff"/></marker>
  <style>
    .bg{fill:#0e1220}.title{font:700 39px 'Segoe UI',Arial;fill:#eef2ff}.sub{font:18px 'Segoe UI',Arial;fill:#aab5d1}
    .panel{fill:#1a2238;stroke:#34415f;stroke-width:2}.pt{font:700 21px 'Segoe UI',Arial;fill:#eef2ff}
    .n{stroke-width:2;rx:16}.nt{font:700 19px 'Segoe UI',Arial;fill:#eef2ff;text-anchor:middle}.ns{font:15px 'Segoe UI',Arial;fill:#c5cce0;text-anchor:middle}
    .edge{fill:none;stroke:#8090b2;stroke-width:2.6;marker-end:url(#arr)}.edgeblue{fill:none;stroke:#66a6ff;stroke-width:2.8;marker-end:url(#arrBlue)}
    .lab{font:14px 'Segoe UI',Arial;fill:#dce4fa;text-anchor:middle}
    .foot{font:14px 'Segoe UI',Arial;fill:#aab5d1}
  </style>
</defs>
<rect class="bg" width="1800" height="1360"/>
<text class="title" x="64" y="65">AI-POWERED SMART STUDY PLANNER</text>
<text class="sub" x="66" y="102">Application architecture • academic tracking • deep-learning insights • adaptive study planning</text>

<!-- student -->
<rect x="720" y="135" width="360" height="62" rx="31" fill="#30264b" stroke="#b69cff" stroke-width="2"/>
<text class="nt" x="900" y="173">STUDENT / LEARNER</text>

<!-- UI layer -->
<rect class="panel" x="70" y="235" width="1660" height="230" rx="22"/>
<text class="pt" x="98" y="271">01  ·  STUDENT INTERFACE — STREAMLIT</text>
<rect class="n" x="145" y="315" width="440" height="105" fill="#172d4b" stroke="#66a6ff"/>
<text class="nt" x="365" y="354">Main dashboard</text><text class="ns" x="365" y="384">app/main.py · login + Progress / AI / Schedule tabs</text>
<rect class="n" x="680" y="315" width="440" height="105" fill="#172d4b" stroke="#66a6ff"/>
<text class="nt" x="900" y="354">Performance tracker</text><text class="ns" x="900" y="384">app/app_streamlit.py</text>
<rect class="n" x="1215" y="315" width="440" height="105" fill="#172d4b" stroke="#66a6ff"/>
<text class="nt" x="1435" y="354">Alternate portal UI</text><text class="ns" x="1435" y="384">app/ui.py</text>
<path class="edge" d="M900 197 V225 H365 V315"/><path class="edge" d="M900 225 V315"/><path class="edge" d="M900 225 H1435 V315"/>
<text class="lab" x="900" y="218">uses</text>

<!-- services -->
<rect class="panel" x="70" y="535" width="1060" height="300" rx="22"/>
<text class="pt" x="98" y="572">02  ·  APPLICATION SERVICES — utils/</text>
<rect class="n" x="115" y="630" width="285" height="125" fill="#123b3a" stroke="#46d7c5"/>
<text class="nt" x="257" y="675">Academic analysis</text><text class="ns" x="257" y="707">analysis.py · weak / strong</text><text class="ns" x="257" y="729">topic + performance level</text>
<rect class="n" x="455" y="630" width="285" height="125" fill="#123b3a" stroke="#46d7c5"/>
<text class="nt" x="597" y="675">Smart schedule</text><text class="ns" x="597" y="707">schedule.py · 7-day plan</text><text class="ns" x="597" y="729">topic-focused study blocks</text>
<rect class="n" x="795" y="630" width="285" height="125" fill="#123b3a" stroke="#46d7c5"/>
<text class="nt" x="937" y="675">DL inference</text><text class="ns" x="937" y="707">engine_dl.py</text><text class="ns" x="937" y="729">NN prediction + AE reconstruction</text>
<path class="edgeblue" d="M365 420 V490 H257 V630"/><path class="edgeblue" d="M365 490 H597 V630"/><path class="edgeblue" d="M900 420 V490 H937 V630"/>
<path class="edgeblue" d="M1435 420 V490 H597 V630"/>
<text class="lab" x="257" y="515">analyzes scores</text><text class="lab" x="597" y="515">requests study plan</text><text class="lab" x="937" y="515">requests model insights</text>

<!-- database -->
<rect class="panel" x="1240" y="535" width="490" height="300" rx="22"/>
<text class="pt" x="1268" y="572">03  ·  PERSISTENCE</text>
<rect class="n" x="1305" y="640" width="360" height="115" fill="#49321f" stroke="#ffb86b"/>
<text class="nt" x="1485" y="682">SQLite database</text><text class="ns" x="1485" y="714">student.db · users + weekly records</text>
<path class="edge" d="M365 420 V500 H1485 V640"/><path class="edge" d="M900 420 V515 H1540 V640"/>
<text class="lab" x="1480" y="545">read / write</text>

<!-- offline training -->
<rect class="panel" x="70" y="910" width="1660" height="380" rx="22"/>
<text class="pt" x="98" y="948">04  ·  OFFLINE DATA &amp; MODEL TRAINING</text>
<rect class="n" x="120" y="1030" width="310" height="135" fill="#30264b" stroke="#b69cff"/>
<text class="nt" x="275" y="1075">Student dataset</text><text class="ns" x="275" y="1107">dataset/student_dataset_25000 (1).xlsx</text>
<rect class="n" x="520" y="1030" width="330" height="135" fill="#30264b" stroke="#b69cff"/>
<text class="nt" x="685" y="1075">Preprocessing</text><text class="ns" x="685" y="1107">utils/preprocessing.py</text><text class="ns" x="685" y="1130">feature engineering + scaling</text>
<rect class="n" x="945" y="990" width="325" height="105" fill="#482234" stroke="#ff7d9a"/>
<text class="nt" x="1107" y="1032">Neural network training</text><text class="ns" x="1107" y="1060">train_models.py / train_nn.py</text>
<rect class="n" x="945" y="1140" width="325" height="105" fill="#482234" stroke="#ff7d9a"/>
<text class="nt" x="1107" y="1182">Autoencoder training</text><text class="ns" x="1107" y="1210">train_models.py / train_autoencoder.py</text>
<rect class="n" x="1360" y="990" width="300" height="105" fill="#482234" stroke="#ff7d9a"/>
<text class="nt" x="1510" y="1032">LSTM trainer</text><text class="ns" x="1510" y="1060">train_lstm.py · separate workflow</text>
<rect class="n" x="1360" y="1140" width="300" height="105" fill="#49321f" stroke="#ffb86b"/>
<text class="nt" x="1510" y="1182">Saved models</text><text class="ns" x="1510" y="1210">nn_model.h5 · autoencoder.h5</text>
<path class="edge" d="M430 1097 H520"/><path class="edge" d="M850 1097 H900 V1042 H945"/><path class="edge" d="M900 1097 V1192 H945"/>
<path class="edge" d="M850 1097 H900 V1042 H1360"/>
<path class="edge" d="M1270 1042 H1315 V1192 H1360"/><path class="edge" d="M1270 1192 H1360"/>
<path class="edge" d="M937 755 V875 H1510 V1140"/>
<text class="lab" x="475" y="1085">loads data</text><text class="lab" x="900" y="1015">features</text><text class="lab" x="1320" y="1115">saves weights</text><text class="lab" x="1185" y="865">inference loads saved NN + AE</text>
<text class="foot" x="98" y="1268">Note: the LSTM trainer is present as a standalone training script; current dashboard inference uses the saved neural network and autoencoder.</text>
</svg>